apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: docker-optimization
data:
  APP_HOST: "0.0.0.0"
  APP_PORT: "5000"
  DB_HOST: "postgres"
  DB_PORT: "5432"
  DB_NAME: "appdb"
  IMAGE_COMPARISON_REPORT: "/app/reports/image-comparison.json"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: docker-optimization
data:
  init.sql: |
    CREATE TABLE IF NOT EXISTS notes (
        id SERIAL PRIMARY KEY,
        title VARCHAR(255) NOT NULL,
        description TEXT NOT NULL,
        created_at TIMESTAMPTZ NOT NULL DEFAULT NOW()
    );
